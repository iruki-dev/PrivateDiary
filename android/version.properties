# The version people see (Settings → 앱 버전, App Distribution, later Play).
# Bump by hand when a release's contents change: MAJOR.MINOR.PATCH.
#
# The build number (versionCode) is NOT kept here: the tester-distribution
# workflow (.github/workflows/android-distribute.yml) assigns a new, always
# higher one to every build it ships, so testers' phones can always update.
versionName=1.0.0
